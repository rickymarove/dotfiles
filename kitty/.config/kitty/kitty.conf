
# ==========================================
# SHELL
# ==========================================
shell /usr/bin/fish
shell_integration enabled no-cursor

# ==========================================
# FONT
# ==========================================
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0

# ==========================================
# CURSOR
# ==========================================
cursor_shape block

# Optional cursor animation
# Uncomment if you like the effect:
# cursor_trail 20

# ==========================================
# TRANSPARENCY
# ==========================================
background_opacity 0.80
dynamic_background_opacity yes

# ==========================================
# WINDOW DECORATIONS
# ==========================================
hide_window_decorations titlebar-only

# ==========================================
# SPACING
# ==========================================
window_padding_width 2 10 5
window_margin_width 2 10 5

# ==========================================
# MOUSE
# ==========================================
mouse_hide_wait 3.0

# ==========================================
# TAB BAR
# ==========================================
tab_bar_edge top
tab_bar_align center
tab_bar_style separator
tab_separator " • "
tab_bar_margin_height 0.0 0.0
tab_title_max_length 30
tab_title_template "{index}: {title.split(' ')[0]}"

# ==========================================
# CATPPUCCIN MOCHA
# ==========================================
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

